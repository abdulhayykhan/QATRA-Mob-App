name: Build & Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      custom_tag:
        description: 'Custom tag override (e.g. v1.0.0). Leave blank to auto-increment from latest tag.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Determine Next Semantic Release Tag
        id: tagger
        run: |
          # Fetch all remote tags
          git fetch --tags --force || true

          CUSTOM_TAG="${{ github.event.inputs.custom_tag }}"

          if [ -n "$CUSTOM_TAG" ]; then
            NEXT_TAG="$CUSTOM_TAG"
            echo "Using manual tag override: $NEXT_TAG"
          else
            # Find the latest tag matching v*.*.* using version sorting
            LATEST_TAG=$(git tag -l "v[0-9]*.[0-9]*.[0-9]*" --sort=-v:refname | head -n 1)

            if [ -z "$LATEST_TAG" ]; then
              NEXT_TAG="v0.0.1"
              echo "No previous tags found. Initializing with: $NEXT_TAG"
            else
              echo "Latest tag found: $LATEST_TAG"
              VERSION="${LATEST_TAG#v}"
              MAJOR=$(echo "$VERSION" | cut -d. -f1)
              MINOR=$(echo "$VERSION" | cut -d. -f2)
              PATCH=$(echo "$VERSION" | cut -d. -f3)

              # Convert to decimal numbers to avoid octal issues
              MAJOR=$((10#$MAJOR))
              MINOR=$((10#$MINOR))
              PATCH=$((10#$PATCH))

              # Specification:
              # v0.0.1 -> v0.0.9 -> v0.1.0 -> v0.1.9 -> v0.2.0 ... -> v0.9.9 -> v1.0.0
              if [ $PATCH -lt 9 ]; then
                PATCH=$((PATCH + 1))
              else
                PATCH=0
                if [ $MINOR -lt 9 ]; then
                  MINOR=$((MINOR + 1))
                else
                  MINOR=0
                  MAJOR=$((MAJOR + 1))
                fi
              fi

              NEXT_TAG="v${MAJOR}.${MINOR}.${PATCH}"
              echo "Calculated next tag: $NEXT_TAG"
            fi
          fi

          echo "TAG_NAME=$NEXT_TAG" >> $GITHUB_ENV
          echo "VERSION_NAME=${NEXT_TAG#v}" >> $GITHUB_ENV

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Release APK
        run: |
          flutter build apk --release \
            --build-name="${{ env.VERSION_NAME }}" \
            --build-number="${{ github.run_number }}"

      - name: Prepare Release Artifacts
        run: |
          APK_SOURCE="build/app/outputs/flutter-apk/app-release.apk"
          APK_TARGET="qatra-release-${{ env.TAG_NAME }}.apk"
          cp "$APK_SOURCE" "$APK_TARGET"
          echo "Created release asset: $APK_TARGET"

      - name: Push Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ env.TAG_NAME }}" -m "Release ${{ env.TAG_NAME }}"
          git push origin "${{ env.TAG_NAME }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## QATRA Mobile Android — Release ${{ env.TAG_NAME }}
            
            **Alkhidmat Foundation Pakistan Emergency Blood Response Platform**
            
            ### 📦 Release Assets
            - **Download Android APK:** [`qatra-release-${{ env.TAG_NAME }}.apk`](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG_NAME }}/qatra-release-${{ env.TAG_NAME }}.apk)
            
            ### 🛡️ Build & Quality Verification
            - **Test Suite:** Passed (100% test pass rate on all unit & widget tests)
            - **Flutter Channel:** `stable`
            - **Target Platform:** Android (minSdk 21, targetSdk 34)
            - **Build Number:** `${{ github.run_number }}`
            - **Commit SHA:** `${{ github.sha }}`
          files: |
            qatra-release-${{ env.TAG_NAME }}.apk
            build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
