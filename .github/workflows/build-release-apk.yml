name: Build & Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      custom_tag:
        description: 'Custom tag override (e.g. v1.0.0). Leave blank to auto-increment from latest tag.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Determine Next Semantic Release Tag
        id: tagger
        run: |
          NEXT_TAG=$(python3 .github/scripts/calculate_next_tag.py "${{ github.event.inputs.custom_tag }}")
          echo "Determined release tag: $NEXT_TAG"
          echo "TAG_NAME=$NEXT_TAG" >> $GITHUB_ENV
          echo "VERSION_NAME=${NEXT_TAG#v}" >> $GITHUB_ENV

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Release APK
        run: |
          flutter build apk --release \
            --build-name="${{ env.VERSION_NAME }}" \
            --build-number="${{ github.run_number }}"

      - name: Push Git Tag & Finalize Release Assets
        id: push_tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Re-verify latest tag on remote in case another workflow pushed during the APK build
          FINAL_TAG=$(python3 .github/scripts/calculate_next_tag.py "${{ github.event.inputs.custom_tag }}")
          echo "Final verified release tag: $FINAL_TAG"

          # Create annotated tag locally
          git tag -a "$FINAL_TAG" -m "Release $FINAL_TAG" || true

          # Push tag with collision retry loop
          until git push origin "$FINAL_TAG"; do
            echo "Push conflict on $FINAL_TAG! Advancing to next tag..."
            git tag -d "$FINAL_TAG" || true
            FINAL_TAG=$(python3 .github/scripts/calculate_next_tag.py "")
            git tag -a "$FINAL_TAG" -m "Release $FINAL_TAG"
          done

          echo "Successfully pushed tag: $FINAL_TAG"
          echo "TAG_NAME=$FINAL_TAG" >> $GITHUB_ENV
          echo "VERSION_NAME=${FINAL_TAG#v}" >> $GITHUB_ENV

          # Prepare Release Artifacts matching final tag
          APK_SOURCE="build/app/outputs/flutter-apk/app-release.apk"
          APK_TARGET="qatra-release-${FINAL_TAG}.apk"
          cp "$APK_SOURCE" "$APK_TARGET"
          echo "Created release asset: $APK_TARGET"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## QATRA Mobile Android — Release ${{ env.TAG_NAME }}
            
            **Alkhidmat Foundation Pakistan Emergency Blood Response Platform**
            
            ### 📦 Release Assets
            - **Download Android APK:** [`qatra-release-${{ env.TAG_NAME }}.apk`](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG_NAME }}/qatra-release-${{ env.TAG_NAME }}.apk)
            
            ### 🛡️ Build & Quality Verification
            - **Test Suite:** Passed (100% test pass rate on all unit & widget tests)
            - **Flutter Channel:** `stable`
            - **Target Platform:** Android (minSdk 21, targetSdk 34)
            - **Build Number:** `${{ github.run_number }}`
            - **Commit SHA:** `${{ github.sha }}`
          files: |
            qatra-release-*.apk
            build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
